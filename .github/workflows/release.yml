name: Build Kotlin APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Extract Version from app/build.gradle.kts safely
      - name: Get version from build.gradle.kts
        id: gradle_version
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | tr -d '\r')
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          echo "display_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. Decode the Keystore into a secure absolute path location
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 is not configured"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"
          test -s "$GITHUB_WORKSPACE/release-key.jks" || {
            echo "::error::Decoded keystore is empty"
            exit 1
          }

      # 3. Build and Sign the Release APK using absolute project workspace path properties
      - name: Build Signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew app:assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # 4. Create Release using softprops/action-gh-release@v2
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gradle_version.outputs.tag_name }}
          name: Release ${{ steps.gradle_version.outputs.display_version }}
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
